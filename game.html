<!--- One game file for spa -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/game.css">
    <title>Solve The Unknown</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body>
    <div class="container">

        <div class="topbar">
            <h1>Solve the Unknown</h1>
            <div class="ticking">
                <div class="count">Time 05:00</div>
                <div class="count">Missons 3 left</div>
                <div class="count">Evidence (3)</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab">Case file</button>
            <button class="tab">Suspects</button>
            <button class="tab">Missons</button>
            <button class="tab">Accuse</button>
            
        </div>
    </div>
</body>
</html>
